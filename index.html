<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية | مكتبة الفيزياء</title>
<style>
:root{--bg:#07101d;--panel:#0e1a2a;--panel2:#122237;--text:#eef7ff;--muted:#9eb0c4;--line:#1e334c;--a:#35c8ff;--b:#6675ff;--danger:#ff5470;--ok:#35d39a;--warn:#ffb142;--font-scale:1}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#153052 0,transparent 35%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh;font-size:calc(16px * var(--font-scale))}a{text-decoration:none;color:inherit}
.top{min-height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 4%;position:sticky;top:0;background:#07101de8;backdrop-filter:blur(16px);z-index:20;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}.brand>span{font-size:30px}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}
nav{display:flex;gap:14px;color:var(--muted);align-items:center;flex-wrap:wrap}nav a{cursor:pointer;font-size:14px;padding:6px 8px;border-radius:8px;transition:.2s}nav a:hover,nav a.active-nav{color:var(--a);background:#35c8ff12}
.top-tools{display:flex;gap:8px;align-items:center}
.theme{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 11px;cursor:pointer;color:var(--text);font-weight:bold}
.ticker{background:linear-gradient(90deg,#1e3a8a,#0e1a2a);border-bottom:1px solid var(--line);padding:9px 5%;color:var(--a);font-size:14px;display:flex;align-items:center;gap:10px}
.ticker b{background:var(--danger);color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;white-space:nowrap}
.countdown-bar{max-width:1180px;margin:20px auto 0;padding:16px 24px;border-radius:18px;background:linear-gradient(135deg,#162c46,#0e1a2a);border:1px solid #35c8ff55;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.cd-boxes{display:flex;gap:10px}.cd-box{background:#07101d;border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;min-width:65px}.cd-box b{display:block;font-size:20px;color:var(--a)}.cd-box small{font-size:11px;color:var(--muted)}
.hero{max-width:1180px;margin:30px auto;padding:45px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(135deg,#10243a,#0b1525);display:flex;justify-content:space-between;align-items:center;overflow:hidden}
.hero h1{font-size:46px;margin:18px 0}.hero em{font-style:normal;background:linear-gradient(90deg,var(--a),#8791ff);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);max-width:650px;line-height:1.9}.orb{font-size:120px;filter:drop-shadow(0 0 35px #35c8ff66)}
.pill{display:inline-block;padding:7px 12px;border-radius:999px;background:#35c8ff15;border:1px solid #35c8ff40;color:var(--a);font-size:13px}
.badge-new{background:#ff547025;color:#ff7187;border:1px solid #ff547066;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:bold;margin-right:6px}
.badge-vid{background:#6675ff25;color:#9aa4ff;border:1px solid #6675ff66;padding:12px;border-radius:10px;font-weight:bold}
.search{display:flex;gap:10px;margin-top:25px;max-width:650px}.search input,input,select,textarea{width:100%;background:#081322;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;outline:none;font-family:inherit}
.search button,.primary{border:0;border-radius:12px;background:linear-gradient(90deg,var(--a),var(--b));color:white;padding:12px 22px;font-weight:bold;cursor:pointer}
.stats{max-width:1180px;margin:20px auto 40px;display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.stats div,.panel,.announcement{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.stats b{font-size:28px;display:block;color:var(--a)}.stats span{color:var(--muted)}
.section,.page-head,.admin-grid,.files,.schedule{max-width:1180px;margin:35px auto}.section-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.section-head span{color:var(--muted)}h2{margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{display:flex;align-items:center;gap:15px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:18px;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:#35c8ff66}.icon{font-size:30px}.card h3{margin:0 0 7px}.card small{color:var(--muted)}.card strong{margin-right:auto;color:var(--a)}
.ann-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.announcement p{color:var(--muted);line-height:1.8;margin:8px 0 0}
.page-head{padding:20px 0}.page-head h1{font-size:36px;margin:12px 0}.page-head p{color:var(--muted)}
.filters{max-width:1180px;margin:0 auto 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.filters a{padding:9px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--muted);cursor:pointer}.filters .active{color:var(--a);border-color:var(--a)}
.mini{max-width:1180px;margin:20px auto;display:flex;gap:10px;flex-wrap:wrap}
.file{display:flex;align-items:center;gap:15px;background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:16px;margin:10px 0}
.pdf{background:#ff47571a;color:#ff7080;border:1px solid #ff475740;padding:12px;border-radius:10px;font-weight:bold}
.fileinfo{flex:1}.fileinfo h3{margin:0 0 8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}.fileinfo span{color:var(--muted);font-size:12px;margin-left:12px}
.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:bold;display:inline-flex;align-items:center;gap:5px;font-size:13px}
.view{background:#35c8ff18;color:var(--a)}.download{background:#35d39a18;color:var(--ok)}.danger{background:#ff547018;color:#ff7187}.warn-btn{background:#ffb14220;color:var(--warn)}
.star-btn{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:16px;padding:6px 10px;border-radius:10px;cursor:pointer}.star-btn.fav{color:#ffd32a;border-color:#ffd32a66;background:#ffd32a15}
.empty{text-align:center;padding:50px;color:var(--muted);background:var(--panel);border-radius:18px}
.auth{min-height:70vh;display:grid;place-items:center}.authbox{width:min(430px,90%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:35px;text-align:center}.authbox>*{margin-bottom:15px}.authbox form{display:grid;gap:12px}.authbox .primary{padding:13px}.bigicon{font-size:45px}
.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.panel h2{font-size:19px}.panel form{display:grid;gap:10px}.panel label{display:grid;gap:6px;color:var(--muted);font-size:13px}
.uploadbox{border:1px dashed #35c8ff66;padding:16px;text-align:center;border-radius:14px;cursor:pointer}.uploadbox input{border:0}.panel hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.minirow{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0;flex-wrap:wrap}.minirow small{display:block;color:var(--muted);margin-top:4px}
.schedule{display:grid;gap:12px}.schedule article{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;grid-template-columns:1fr 1fr 2fr 1.5fr auto;gap:10px;align-items:center}.schedule strong{color:var(--a)}.schedule small{color:var(--muted)}
.sync-bar{max-width:1180px;margin:0 auto 25px;background:linear-gradient(135deg,#10243a,#0e1a2a);border:1px solid var(--a);border-radius:18px;padding:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(6px);z-index:100;display:none;place-items:center;padding:15px}
.modal-backdrop.open{display:grid}
.modal-box{width:min(1000px,96vw);height:86vh;background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--panel2)}
.modal-body{flex:1;background:#000;position:relative}.modal-body iframe{width:100%;height:100%;border:0}
.fab-tg{position:fixed;bottom:22px;left:22px;background:linear-gradient(135deg,#0088cc,#35c8ff);color:#fff;padding:12px 18px;border-radius:999px;font-weight:bold;box-shadow:0 8px 25px rgba(53,200,255,0.35);z-index:40;display:flex;align-items:center;gap:8px;cursor:pointer;border:0}
.const-table{width:100%;border-collapse:collapse}.const-table th,.const-table td{padding:12px;border-bottom:1px solid var(--line);text-align:right}.const-table th{color:var(--a);background:var(--panel2)}
.quiz-opt{display:block;width:100%;text-align:right;padding:12px 16px;margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);cursor:pointer;font-size:15px}.quiz-opt:hover{border-color:var(--a)}.quiz-opt.correct{background:#35d39a25;border-color:var(--ok);color:var(--ok)}.quiz-opt.wrong{background:#ff547025;border-color:var(--danger);color:#ff7187}
footer{text-align:center;color:var(--muted);padding:50px 20px;border-top:1px solid var(--line);margin-top:50px}
.flash{max-width:1180px;margin:15px auto;padding:14px 18px;border-radius:12px;background:#35d39a18;color:var(--ok);border:1px solid #35d39a44}.flash.error{background:#ff547018;color:#ff7187;border-color:#ff547044}
body.light{--bg:#f2f6fb;--panel:#fff;--panel2:#eef4fb;--text:#102035;--muted:#63758b;--line:#d8e1ec}body.light .top{background:#ffffffdd}body.light input,body.light select,body.light textarea{background:#f7faff;color:#102035}body.light .hero,body.light .countdown-bar,body.light .sync-bar{background:linear-gradient(135deg,#e3effd,#ffffff)}body.light .cd-box{background:#f7faff}
@media(max-width:850px){.hero{margin:20px 4%;padding:28px;display:block}.hero h1{font-size:34px}.orb{display:none}.section,.page-head,.files,.schedule,.admin-grid,.sync-bar,.countdown-bar{margin-left:4%;margin-right:4%}.grid,.admin-grid,.ann-grid,.stats{grid-template-columns:1fr}.stats{margin-left:4%;margin-right:4%}.file{align-items:flex-start;flex-wrap:wrap}.actions{width:100%}.actions .btn{flex:1;justify-content:center}.schedule article{grid-template-columns:1fr 1fr}.schedule article span,.schedule article small{grid-column:1/-1}}
</style>
</head>
<body>

<div id="urgentTicker" class="ticker" style="display:none"></div>

<header class="top">
  <a class="brand" onclick="navigate('home')">
    <span>⚛️</span>
    <div>
      <b id="brandTitle">مكتبة الفيزياء</b>
      <small id="brandSub">المرحلة الرابعة</small>
    </div>
  </a>
  <nav id="mainNav">
    <a onclick="navigate('home')">الرئيسية</a>
    <a onclick="navigate('favorites')">⭐ المفضلة (<span id="favCount">0</span>)</a>
    <a onclick="navigate('schedule')">📅 الجدول</a>
    <a onclick="navigate('tools')">🧰 أدوات الفيزياء</a>
    <a onclick="navigate('graduation')">🎓 التخرج والتطبيق</a>
    <a onclick="navigate('quiz')">📝 اختبر نفسك ومفكرتي</a>
    <a onclick="navigate('request')">📩 اطلب ملزمة</a>
    <a id="adminNavLink" onclick="navigate(isAdmin() ? 'admin' : 'login')">⚙️ الإدارة</a>
    <a id="logoutNavLink" style="display:none;color:var(--danger)" onclick="logoutAdmin()">خروج</a>
  </nav>
  <div class="top-tools">
    <button class="theme" onclick="changeFontSize(0.08)" title="تكبير الخط">A+</button>
    <button class="theme" onclick="changeFontSize(-0.08)" title="تصغير الخط">A-</button>
    <button class="theme" onclick="toggleTheme()" title="تغيير المظهر">🌓</button>
  </div>
</header>

<div id="flashContainer"></div>
<main id="appContent"></main>

<div id="viewerModal" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <b id="modalTitle">عرض المحاضرة</b>
      <div style="display:flex;gap:8px">
        <a id="modalExternalBtn" target="_blank" class="btn view">فتح في نافذة جديدة ↗</a>
        <button class="btn danger" onclick="closeModal()">إغلاق ✖</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<button class="fab-tg" onclick="openTelegramChannel()">
  <span>✈️</span> <span id="fabText">قناة المرحلة</span>
</button>

<footer id="siteFooter"></footer>

<script>
/* === START_SHARED_DATA === */
const SHARED_DATA = {
  files: [],
  announcements: [],
  schedule: [],
  quizzes: [
    { id: 1, subject: "ميكانيك الكم", q: "ما هي المعادلة الأساسية التي تصف تطور الدالة الموجية مع الزمن في ميكانيك الكم؟", options: ["معادلة شرودنغر", "معادلة ماكسويل", "معادلة بولتزمان", "قانون كولوم"], ans: 0 },
    { id: 2, subject: "الفيزياء النووية", q: "تُقاس طاقة الربط النووية عادةً بوحدة:", options: ["الواط (Watt)", "الميغا إلكترون فولت (MeV)", "التسلا (Tesla)", "الفاراد (Farad)"], ans: 1 },
    { id: 3, subject: "الليزر", q: "الشرط الأساسي لتوليد أشعة الليزر داخل الوسط الفعال هو تحقيق:", options: ["التأين الحراري", "التوزيع المعكوس (Population Inversion)", "الانكسار الكلي", "الحيود البلوري"], ans: 1 },
    { id: 4, subject: "فيزياء الحالة الصلبة", q: "تُستخدم ظاهرة حيود الأشعة السينية (قانون براغ) في دراسة:", options: ["التركيب البلوري للمواد الصلبة", "انشطار النواة", "طيف ذرة الهيدروجين", "المجال المغناطيسي الأرضي"], ans: 0 }
  ],
  resources: [
    { id: 101, type: "بحث تخرج", title: "قالب كتابة بحث التخرج الرسمي - قسم الفيزياء", desc: "يتضمن ترتيب الواجهة، الإهداء، الملخص، الفصول، وطريقة كتابة المصادر.", url: "#" },
    { id: 102, type: "التربية العملية", title: "نموذج الخطة اليومية والسنوية للمطبقين (فيزياء)", desc: "نماذج خطط تدريسية جاهزة لطلبة المرحلة الرابعة في فترة التطبيق بالمدارس.", url: "#" }
  ],
  settings: {
    siteTitle: "مكتبة الفيزياء",
    siteSub: "المرحلة الرابعة • قسم الفيزياء",
    footerText: "مكتبة فيزياء المرحلة الرابعة - النسخة الاحترافية الشاملة © 2026",
    urgentText: "مرحباً بكم في البوابة الرقمية لقسم الفيزياء - المرحلة الرابعة! جميع الملازم والمحاضرات محدثة باستمرار.",
    examTitle: "العد التنازلي للامتحانات القادمة",
    examDate: "2026-12-20T09:00",
    tgChannel: "https://t.me/",
    adminUser: "admin",
    adminPass: "physics2026"
  }
};
/* === END_SHARED_DATA === */

const SUBJECTS = [
  ["quantum", "ميكانيك الكم", "⚛️"],
  ["measurement", "القياس والتقويم", "📏"],
  ["educational_lab", "المختبر التعليمي", "🔬"],
  ["nuclear", "الفيزياء النووية", "☢️"],
  ["solid_state", "فيزياء الحالة الصلبة", "🧊"],
  ["nuclear_lab", "مختبر النووية", "🧪"],
  ["laser", "الليزر", "🔦"],
  ["electromagnetic", "النظرية الكهرومغناطيسية", "⚡"],
  ["teaching", "التربية التعليمية", "👨‍🏫"]
];

const CATEGORIES = ["ملازم", "محاضرات", "ملخصات", "أسئلة وامتحانات", "فيديوهات يوتيوب", "مصادر", "أخرى"];
const SUBJECT_MAP = {};
SUBJECTS.forEach(s => SUBJECT_MAP[s[0]] = s[1]);

const PHYSICS_CONSTANTS = [
  { name: "ثابت بلانك (h)", symbol: "h", val: "6.62607015 × 10⁻³⁴", unit: "J·s" },
  { name: "ثابت بلانك المخفض (ℏ)", symbol: "ℏ", val: "1.054571817 × 10⁻³⁴", unit: "J·s" },
  { name: "سرعة الضوء في الفراغ (c)", symbol: "c", val: "2.99792458 × 10⁸", unit: "m/s" },
  { name: "شحنة الإلكترون (e)", symbol: "e", val: "1.602176634 × 10⁻¹⁹", unit: "C" },
  { name: "كتلة الإلكترون السكونية (mₑ)", symbol: "mₑ", val: "9.1093837 × 10⁻³¹", unit: "kg" },
  { name: "كتلة البروتون (mₚ)", symbol: "mₚ", val: "1.6726219 × 10⁻²⁷", unit: "kg" },
  { name: "كتلة النيوترون (mₙ)", symbol: "mₙ", val: "1.67492749 × 10⁻²⁷", unit: "kg" },
  { name: "وحدة الكتل الذرية (u)", symbol: "u", val: "931.494", unit: "MeV/c²" },
  { name: "ثابت بولتزمان (k_B)", symbol: "k_B", val: "1.380649 × 10⁻²³", unit: "J/K" },
  { name: "عدد أفوغادرو (N_A)", symbol: "N_A", val: "6.02214076 × 10²³", unit: "mol⁻¹" },
  { name: "سماحية الفراغ الكهربائية (ε₀)", symbol: "ε₀", val: "8.85418781 × 10⁻¹²", unit: "F/m" },
  { name: "ثابت ريدبيرغ (R_∞)", symbol: "R_∞", val: "1.097373156 × 10⁷", unit: "m⁻¹" }
];

let store = {
  files: JSON.parse(localStorage.getItem("phys_files") || "null") || SHARED_DATA.files,
  announcements: JSON.parse(localStorage.getItem("phys_announcements") || "null") || SHARED_DATA.announcements,
  schedule: JSON.parse(localStorage.getItem("phys_schedule") || "null") || SHARED_DATA.schedule,
  quizzes: JSON.parse(localStorage.getItem("phys_quizzes") || "null") || SHARED_DATA.quizzes,
  resources: JSON.parse(localStorage.getItem("phys_resources") || "null") || SHARED_DATA.resources,
  settings: Object.assign({}, SHARED_DATA.settings, JSON.parse(localStorage.getItem("phys_settings") || "{}"))
};

let favorites = JSON.parse(localStorage.getItem("phys_favs") || "[]");
let todos = JSON.parse(localStorage.getItem("phys_todos") || "[]");

fetch("data.json?t=" + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (data) {
      if (data.files) store.files = data.files;
      if (data.announcements) store.announcements = data.announcements;
      if (data.schedule) store.schedule = data.schedule;
      if (data.quizzes) store.quizzes = data.quizzes;
      if (data.resources) store.resources = data.resources;
      if (data.settings) store.settings = Object.assign({}, store.settings, data.settings);
      saveLocalStore();
      applySiteBranding();
      render();
    }
  })
  .catch(() => {});

function saveLocalStore() {
  localStorage.setItem("phys_files", JSON.stringify(store.files));
  localStorage.setItem("phys_announcements", JSON.stringify(store.announcements));
  localStorage.setItem("phys_schedule", JSON.stringify(store.schedule));
  localStorage.setItem("phys_quizzes", JSON.stringify(store.quizzes));
  localStorage.setItem("phys_resources", JSON.stringify(store.resources));
  localStorage.setItem("phys_settings", JSON.stringify(store.settings));
  applySiteBranding();
}

function applySiteBranding() {
  const s = store.settings || SHARED_DATA.settings;
  document.getElementById("brandTitle").textContent = s.siteTitle || "مكتبة الفيزياء";
  document.getElementById("brandSub").textContent = s.siteSub || "المرحلة الرابعة";
  document.getElementById("siteFooter").textContent = s.footerText || "";
  document.getElementById("favCount").textContent = favorites.length;
  const ticker = document.getElementById("urgentTicker");
  if (s.urgentText && s.urgentText.trim()) {
    ticker.style.display = "flex";
    ticker.innerHTML = `<b>📢 تبليغ</b> <span>${escapeHtml(s.urgentText)}</span>`;
  } else {
    ticker.style.display = "none";
  }
}

function openTelegramChannel() {
  const url = (store.settings && store.settings.tgChannel) || "https://t.me/";
  window.open(url, "_blank");
}

function isAdmin() {
  return sessionStorage.getItem("phys_admin") === "1";
}

function showFlash(msg, type = "success") {
  const c = document.getElementById("flashContainer");
  c.innerHTML = `<div class="flash ${type === 'error' ? 'error' : ''}">${msg}</div>`;
  setTimeout(() => { c.innerHTML = ""; }, 5000);
}

function toggleTheme() {
  document.body.classList.toggle("light");
  localStorage.setItem("phys_theme", document.body.classList.contains("light") ? "light" : "dark");
}
if (localStorage.getItem("phys_theme") === "light") document.body.classList.add("light");

let fontScale = parseFloat(localStorage.getItem("phys_font_scale") || "1");
document.documentElement.style.setProperty("--font-scale", fontScale);
function changeFontSize(delta) {
  fontScale = Math.min(1.3, Math.max(0.85, +(fontScale + delta).toFixed(2)));
  document.documentElement.style.setProperty("--font-scale", fontScale);
  localStorage.setItem("phys_font_scale", fontScale);
}

function isNewFile(createdAt) {
  if (!createdAt) return false;
  return (Date.now() - createdAt) < (3 * 24 * 60 * 60 * 1000);
}

function toggleFav(id) {
  const idx = favorites.indexOf(id);
  if (idx === -1) {
    favorites.push(id);
    showFlash("⭐ تمت إضافة الملزمة إلى المفضلة");
  } else {
    favorites.splice(idx, 1);
  }
  localStorage.setItem("phys_favs", JSON.stringify(favorites));
  document.getElementById("favCount").textContent = favorites.length;
  render();
}

function shareFile(title, url) {
  const shareUrl = url && url.startsWith("http") ? url : window.location.href;
  if (navigator.share) {
    navigator.share({ title, text: `ملزمة/محاضرة: ${title}`, url: shareUrl }).catch(() => {});
  } else {
    navigator.clipboard.writeText(`${title} - ${shareUrl}`);
    showFlash("🔗 تم نسخ رابط المشاركة للحافظة");
  }
}

function getYoutubeEmbed(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

function getViewUrl(url) {
  if (!url) return "#";
  const yt = getYoutubeEmbed(url);
  if (yt) return yt;
  const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
  return url;
}

function getDownloadUrl(url) {
  if (!url) return "#";
  const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) return `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
  return url;
}

function openInModal(id) {
  const f = store.files.find(x => x.id === id);
  if (!f) return;
  countDownload(id, false);
  const viewUrl = getViewUrl(f.url);
  document.getElementById("modalTitle").textContent = f.title;
  document.getElementById("modalExternalBtn").href = f.url || "#";
  document.getElementById("modalBody").innerHTML = `<iframe src="${viewUrl}" allowfullscreen></iframe>`;
  document.getElementById("viewerModal").classList.add("open");
}

function closeModal() {
  document.getElementById("viewerModal").classList.remove("open");
  document.getElementById("modalBody").innerHTML = "";
}

function renderFileCard(f) {
  const isFav = favorites.includes(f.id);
  const isVid = f.category === "فيديوهات يوتيوب" || getYoutubeEmbed(f.url);
  const newBadge = isNewFile(f.created_at || f.id) ? `<span class="badge-new">جديد 🔥</span>` : "";
  return `
    <article class="file">
      <div class="${isVid ? 'badge-vid' : 'pdf'}">${isVid ? '▶ فيديو' : 'PDF'}</div>
      <div class="fileinfo">
        <h3>${escapeHtml(f.title)} ${newBadge}</h3>
        <div>
          <span>📚 ${SUBJECT_MAP[f.subject] || f.subject}</span>
          <span>🏷️ ${escapeHtml(f.category)}</span>
          ${f.teacher ? `<span>👨‍🏫 ${escapeHtml(f.teacher)}</span>` : ""}
          <span>⬇ ${f.downloads || 0}</span>
        </div>
      </div>
      <div class="actions">
        <button class="star-btn ${isFav ? 'fav' : ''}" onclick="toggleFav(${f.id})" title="حفظ بالمفضلة">★</button>
        <button class="btn view" onclick="openInModal(${f.id})">👁 عرض بالموقع</button>
        <a class="btn download" target="_blank" href="${getDownloadUrl(f.url)}" download="${escapeHtml(f.original_name || f.title + '.pdf')}" onclick="countDownload(${f.id}, true)">⬇ تحميل</a>
        <button class="btn warn-btn" onclick="shareFile('${escapeHtml(f.title)}', '${escapeHtml(f.url || '')}')">🔗 مشاركة</button>
        ${isAdmin() ? `<button class="btn view" onclick="editFilePrompt(${f.id})">✏️ تعديل</button><button class="btn danger" onclick="deleteFile(${f.id})">🗑 حذف</button>` : ""}

let currentState = { page: "home", slug: "", category: "", q: "", sort: "newest" };

function navigate(page, params = {}) {
  currentState = {
    page,
    slug: params.slug || "",
    category: params.category || "",
    q: params.q || "",
    sort: params.sort || "newest"
  };
  document.getElementById("logoutNavLink").style.display = isAdmin() ? "inline" : "none";
  render();
  window.scrollTo(0, 0);
}

function getCountdownHtml() {
  const s = store.settings || {};
  if (!s.examDate) return "";
  const diff = new Date(s.examDate).getTime() - Date.now();
  if (diff <= 0) return "";
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const mins = Math.floor((diff / (1000 * 60)) % 60);
  return `
    <div class="countdown-bar">
      <div>
        <span class="pill">⏳ تذكير المواعيد</span>
        <h3 style="margin:6px 0 0">${escapeHtml(s.examTitle || "العد التنازلي للامتحانات")}</h3>
      </div>
      <div class="cd-boxes">
        <div class="cd-box"><b>${days}</b><small>يوم</small></div>
        <div class="cd-box"><b>${hours}</b><small>ساعة</small></div>
        <div class="cd-box"><b>${mins}</b><small>دقيقة</small></div>
      </div>
    </div>
  `;
}

function runUnitConverter() {
  const val = parseFloat(document.getElementById("convInput").value) || 0;
  const type = document.getElementById("convType").value;
  let out = "";
  if (type === "ev_to_j") out = (val * 1.602176634e-19).toExponential(5) + " J";
  else if (type === "j_to_ev") out = (val / 1.602176634e-19).toExponential(5) + " eV";
  else if (type === "mev_to_j") out = (val * 1.602176634e-13).toExponential(5) + " J";
  else if (type === "ang_to_nm") out = (val * 0.1).toFixed(4) + " nm";
  else if (type === "ang_to_m") out = (val * 1e-10).toExponential(4) + " m";
  else if (type === "c_to_k") out = (val + 273.15).toFixed(2) + " K";
  else if (type === "nm_to_ev") out = val > 0 ? (1239.84193 / val).toFixed(4) + " eV" : "0 eV";
  document.getElementById("convOutput").textContent = out;
}

function calcGrade() {
  const m1 = parseFloat(document.getElementById("gMonth1").value) || 0;
  const m2 = parseFloat(document.getElementById("gMonth2").value) || 0;
  const lab = parseFloat(document.getElementById("gLab").value) || 0;
  const fin = parseFloat(document.getElementById("gFinal").value) || 0;
  const sai = m1 + m2 + lab;
  document.getElementById("gSaiResult").textContent = sai.toFixed(1);
  if (fin > 0) {
    const tot = sai + fin;
    let est = "راسب";
    if (tot >= 90) est = "امتياز 🌟";
    else if (tot >= 80) est = "جيد جداً ✨";
    else if (tot >= 70) est = "جيد 👍";
    else if (tot >= 60) est = "متوسط";
    else if (tot >= 50) est = "مقبول";
    document.getElementById("gTotalResult").textContent = `${tot.toFixed(1)} (${est})`;
  } else {
    document.getElementById("gTotalResult").textContent = `تحتاج ${(50 - sai > 0 ? (50 - sai).toFixed(1) : 0)} للنجاح`;
  }
}

function calcGPA() {
  const g1 = parseFloat(document.getElementById("gpa1").value) || 0;
  const g2 = parseFloat(document.getElementById("gpa2").value) || 0;
  const g3 = parseFloat(document.getElementById("gpa3").value) || 0;
  const g4 = parseFloat(document.getElementById("gpa4").value) || 0;
  const res = (g1 * 0.10) + (g2 * 0.20) + (g3 * 0.30) + (g4 * 0.40);
  document.getElementById("gpaFinalOut").textContent = res.toFixed(2) + "%";
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadFileToGitHubRepo(file, ghCfg) {
  const dataUrl = await fileToBase64(file);
  const base64Content = dataUrl.split(",")[1];
  const safeName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = `uploads/${safeName}`;
  const apiUrl = `https://api.github.com/repos/${ghCfg.owner}/${ghCfg.repo}/contents/${path}`;
  const res = await fetch(apiUrl, {
    method: "PUT",
    headers: { "Authorization": `Bearer ${ghCfg.token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ message: `Upload ${file.name}`, content: base64Content })
  });
  if (!res.ok) throw new Error("فشل رفع الملف إلى GitHub");
  return path;
}

async function handleUpload(e) {
  e.preventDefault();
  const subject = document.getElementById("upSubject").value;
  const category = document.getElementById("upCategory").value;
  const titleInput = document.getElementById("upTitle").value.trim();
  const teacher = document.getElementById("upTeacher").value.trim();
  const directUrl = document.getElementById("upUrl").value.trim();
  const fileList = document.getElementById("upFiles").files;
  const ghCfg = JSON.parse(localStorage.getItem("phys_gh_cfg") || "{}");

  const btn = document.getElementById("uploadBtn");
  btn.disabled = true;
  btn.textContent = "جاري الرفع والحفظ...";

  try {
    if (directUrl) {
      store.files.unshift({
        id: Date.now(),
        created_at: Date.now(),
        subject, category,
        title: titleInput || "محاضرة دراسية",
        original_name: (titleInput || "file") + ".pdf",
        teacher, url: directUrl, downloads: 0
      });
    } else if (fileList && fileList.length > 0) {
      for (const file of Array.from(fileList)) {
        const finalTitle = titleInput || file.name.replace(/\.pdf$/i, "");
        let fileUrl = (ghCfg.owner && ghCfg.repo && ghCfg.token)
          ? await uploadFileToGitHubRepo(file, ghCfg)
          : await fileToBase64(file);

        store.files.unshift({
          id: Date.now() + Math.floor(Math.random() * 1000),
          created_at: Date.now(),
          subject, category,
          title: finalTitle,
          original_name: file.name,
          teacher, url: fileUrl, downloads: 0
        });
      }
    } else {
      showFlash("يرجى وضع رابط أو اختيار ملف PDF", "error");
      btn.disabled = false; btn.textContent = "إضافة وحفظ";
      return;
    }

    saveLocalStore();
    if (ghCfg.owner && ghCfg.repo && ghCfg.token) await syncToGitHub(true);
    else showFlash("تم الحفظ! اضغط على (نشر تلقائي) أو (تنزيل index.html)");
    render();
  } catch (err) {
    showFlash("حدث خطأ: " + err.message, "error");
  } finally {
    if (document.getElementById("uploadBtn")) {
      document.getElementById("uploadBtn").disabled = false;
      document.getElementById("uploadBtn").textContent = "إضافة وحفظ";
    }
  }
}

function exportUpdatedHtml() {
  const dataJson = JSON.stringify(store, null, 2);
  let fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  fullHtml = fullHtml.replace(
    /\/\* === START_SHARED_DATA === \*\/[\s\S]*?\/\* === END_SHARED_DATA === \*\//,
    `/* === START_SHARED_DATA === */\nconst SHARED_DATA = ${dataJson};\n/* === END_SHARED_DATA === */`
  );
  const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  showFlash("تم تنزيل index.html المحدث!");
}

async function syncToGitHub(silent = false) {
  const ghCfg = JSON.parse(localStorage.getItem("phys_gh_cfg") || "{}");
  if (!ghCfg.owner || !ghCfg.repo || !ghCfg.token) {
    if (!silent) showFlash("أدخل إعدادات GitHub في أسفل لوحة الإدارة أولاً", "error");
    return;
  }
  try {
    const apiUrl = `https://api.github.com/repos/${ghCfg.owner}/${ghCfg.repo}/contents/data.json`;
    let sha = undefined;
    const getRes = await fetch(apiUrl, { headers: { "Authorization": `Bearer ${ghCfg.token}` } });
    if (getRes.ok) sha = (await getRes.json()).sha;

    const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(store, null, 2))));
    const putRes = await fetch(apiUrl, {
      method: "PUT",
      headers: { "Authorization": `Bearer ${ghCfg.token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Update physics library data", content: contentBase64, sha })
    });
    if (!putRes.ok) throw new Error("تأكد من صلاحية Token واسم المستودع");
    showFlash("✅ تم نشر جميع التحديثات تلقائياً على GitHub وأصبحت ظاهرة لكل الطلاب الآن!");
  } catch (err) {
    showFlash("خطأ في النشر التلقائي: " + err.message, "error");
  }
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[s]));
}
