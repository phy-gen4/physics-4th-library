body.light{--bg:#f2f6fb;--panel:#fff;--panel2:#eef4fb;--text:#102035;--muted:#63758b;--line:#d8e1ec}body.light .top{background:#ffffffdd}body.light input,body.light select,body.light textarea{background:#f7faff;color:#102035}body.light .hero,body.light .countdown-bar,body.light .sync-bar,body.light .flashcard.flipped{background:linear-gradient(135deg,#e3effd,#ffffff)}body.light .cd-box{background:#f7faff}

  if (navigator.share) {

  } else {
    navigator.clipboard.writeText(`${title} - ${shareUrl}`);
    showFlash("🔗 تم نسخ رابط المحاضرة للحافظة");
  }
}

function getYoutubeEmbed(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

function getViewUrl(url) {
  if (!url) return "#";
  const yt = getYoutubeEmbed(url);
  if (yt) return yt;
  const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
  return url;
}

function getDownloadUrl(url) {
  if (!url) return "#";
  const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) return `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
  return url;
}

let pomoSeconds = 25 * 60;
let pomoTimer = null;

function formatPomoTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function togglePomo() {
  if (pomoTimer) {
    clearInterval(pomoTimer);
    pomoTimer = null;
  } else {
    pomoTimer = setInterval(() => {
      if (pomoSeconds > 0) {
        pomoSeconds--;
        const disp = document.getElementById("pomoDisplay");
        if (disp) disp.textContent = formatPomoTime(pomoSeconds);
      } else {
        clearInterval(pomoTimer);
        pomoTimer = null;
        showFlash("⏰ انتهى وقت الجلسة! خذ استراحة قصيرة.");
        render();
      }
    }, 1000);
  }
  const btn = document.getElementById("pomoStartBtn");
  if (btn) btn.textContent = pomoTimer ? "إيقاف مؤقت ⏸" : "ابدأ التركيز ▶";
}

function setPomoMode(mins) {
  if (pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; }
  pomoSeconds = mins * 60;
  const disp = document.getElementById("pomoDisplay");
  if (disp) disp.textContent = formatPomoTime(pomoSeconds);
  const btn = document.getElementById("pomoStartBtn");
  if (btn) btn.textContent = "ابدأ التركيز ▶";
}

function runUnitConverter() {
  const val = parseFloat(document.getElementById("convInput").value) || 0;
  const type = document.getElementById("convType").value;
  let out = "";
  if (type === "ev_to_j") out = (val * 1.602176634e-19).toExponential(5) + " J";
  else if (type === "j_to_ev") out = (val / 1.602176634e-19).toExponential(5) + " eV";
  else if (type === "mev_to_j") out = (val * 1.602176634e-13).toExponential(5) + " J";
  else if (type === "ang_to_nm") out = (val * 0.1).toFixed(4) + " nm";
  else if (type === "ang_to_m") out = (val * 1e-10).toExponential(4) + " m";
  else if (type === "c_to_k") out = (val + 273.15).toFixed(2) + " K";
  else if (type === "nm_to_ev") out = val > 0 ? (1239.84193 / val).toFixed(4) + " eV" : "0 eV";
  document.getElementById("convOutput").textContent = out;
}

function calcGrade() {
  const m1 = parseFloat(document.getElementById("gMonth1").value) || 0;
  const m2 = parseFloat(document.getElementById("gMonth2").value) || 0;
  const lab = parseFloat(document.getElementById("gLab").value) || 0;
  const fin = parseFloat(document.getElementById("gFinal").value) || 0;
  const sai = m1 + m2 + lab;
  document.getElementById("gSaiResult").textContent = sai.toFixed(1);
  if (fin > 0) {
    const tot = sai + fin;
    let est = "راسب";
    if (tot >= 90) est = "امتياز 🌟";
    else if (tot >= 80) est = "جيد جداً ✨";
    else if (tot >= 70) est = "جيد 👍";
    else if (tot >= 60) est = "متوسط";
    else if (tot >= 50) est = "مقبول";
    document.getElementById("gTotalResult").textContent = `${tot.toFixed(1)} (${est})`;
  } else {
    document.getElementById("gTotalResult").textContent = `تحتاج ${(50 - sai > 0 ? (50 - sai).toFixed(1) : 0)} للنجاح`;
  }
}

function calcGPA() {
  const g1 = parseFloat(document.getElementById("gpa1").value) || 0;
  const g2 = parseFloat(document.getElementById("gpa2").value) || 0;
  const g3 = parseFloat(document.getElementById("gpa3").value) || 0;
  const g4 = parseFloat(document.getElementById("gpa4").value) || 0;
  const res = (g1 * 0.10) + (g2 * 0.20) + (g3 * 0.30) + (g4 * 0.40);
  document.getElementById("gpaFinalOut").textContent = res.toFixed(2) + "%";
}

function checkQuizAnswer(btn, chosen, correct) {
  const parent = btn.parentElement;
  if (parent.dataset.answered === "true") return; // منع تكرار الإجابة لنفس السؤال
  parent.dataset.answered = "true";
  
  studentStats.quizTotal++;
  if (chosen === correct) {
    studentStats.quizCorrect++;
    showFlash("✅ إجابة صحيحة! استمر يا بطل.");
  } else {
    showFlash("❌ إجابة خاطئة! الجواب الصحيح مظلل باللون الأخضر.", "error");
  }
  localStorage.setItem("phys_student_stats", JSON.stringify(studentStats));

  Array.from(parent.children).forEach((b, idx) => {
    b.disabled = true;
    if (idx === correct) b.classList.add("correct");
    else if (idx === chosen) b.classList.add("wrong");
  });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadFileToGitHubRepo(file, ghCfg) {
  const dataUrl = await fileToBase64(file);
  const base64Content = dataUrl.split(",")[1];
  const safeName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = `uploads/${safeName}`;
  const apiUrl = `https://api.github.com/repos/${ghCfg.owner}/${ghCfg.repo}/contents/${path}`;
  const res = await fetch(apiUrl, {
    method: "PUT",
    headers: { "Authorization": `Bearer ${ghCfg.token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ message: `Upload ${file.name}`, content: base64Content })
  });
  if (!res.ok) throw new Error("فشل رفع الملف إلى GitHub");
  return path;
}

async function handleUpload(e) {
  e.preventDefault();
  const subject = document.getElementById("upSubject").value;
  const category = document.getElementById("upCategory").value;
  const titleInput = document.getElementById("upTitle").value.trim();
  const teacher = document.getElementById("upTeacher").value.trim();
  const directUrl = document.getElementById("upUrl").value.trim();
  const fileList = document.getElementById("upFiles").files;
  const ghCfg = JSON.parse(localStorage.getItem("phys_gh_cfg") || "{}");

  const btn = document.getElementById("uploadBtn");
  btn.disabled = true;
  btn.textContent = "جاري الرفع والحفظ...";

  try {
    if (directUrl) {
      store.files.unshift({
        id: Date.now(),
        created_at: Date.now(),
        subject, category,
        title: titleInput || "محاضرة دراسية",
        original_name: (titleInput || "file") + ".pdf",
        teacher, url: directUrl, downloads: 0
      });
    } else if (fileList && fileList.length > 0) {
      for (const file of Array.from(fileList)) {
        const finalTitle = titleInput || file.name.replace(/\.pdf$/i, "");
        let fileUrl = (ghCfg.owner && ghCfg.repo && ghCfg.token)
          ? await uploadFileToGitHubRepo(file, ghCfg)
          : await fileToBase64(file);

        store.files.unshift({
          id: Date.now() + Math.floor(Math.random() * 1000),
          created_at: Date.now(),
          subject, category,
          title: finalTitle,
          original_name: file.name,
          teacher, url: fileUrl, downloads: 0
        });
      }
    } else {
      showFlash("يرجى وضع رابط أو اختيار ملف PDF", "error");
      btn.disabled = false; btn.textContent = "إضافة ونشر للطلاب";
      return;
    }

    saveLocalStore();
    await syncToGitHub(true);
    showFlash("✅ تمت الإضافة والنشر للطلاب بنجاح!");
    render();
  } catch (err) {
    showFlash("حدث خطأ: " + err.message, "error");
  } finally {
    if (document.getElementById("uploadBtn")) {
      document.getElementById("uploadBtn").disabled = false;
      document.getElementById("uploadBtn").textContent = "إضافة ونشر للطلاب";
    }
  }
}

function exportUpdatedHtml() {
  const dataJson = JSON.stringify(store, null, 2);
  let fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  fullHtml = fullHtml.replace(
    /\/\* === START_SHARED_DATA === \*\/[\s\S]*?\/\* === END_SHARED_DATA === \*\//,
    `/* === START_SHARED_DATA === */\nconst SHARED_DATA = ${dataJson};\n/* === END_SHARED_DATA === */`
  );
  const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  showFlash("تم تنزيل index.html المحدث!");
}

async function syncToGitHub(silent = false) {
  const ghCfg = JSON.parse(localStorage.getItem("phys_gh_cfg") || "{}");
  if (!ghCfg.owner || !ghCfg.repo || !ghCfg.token) {
    if (!silent) showFlash("أدخل إعدادات GitHub في أسفل لوحة الإدارة أولاً", "error");
    return;
  }
  try {
    const apiUrl = `https://api.github.com/repos/${ghCfg.owner}/${ghCfg.repo}/contents/data.json`;
    let sha = undefined;
    const getRes = await fetch(apiUrl, { headers: { "Authorization": `Bearer ${ghCfg.token}` } });
    if (getRes.ok) sha = (await getRes.json()).sha;

    const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(store, null, 2))));
    const putRes = await fetch(apiUrl, {
      method: "PUT",
      headers: { "Authorization": `Bearer ${ghCfg.token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Update physics library data", content: contentBase64, sha })
    });
    if (!putRes.ok) throw new Error("تأكد من صلاحية Token واسم المستودع");
    if (!silent) showFlash("✅ تم نشر جميع التحديثات تلقائياً على GitHub وأصبحت ظاهرة لكل الطلاب الآن!");
  } catch (err) {
    if (!silent) showFlash("خطأ في النشر التلقائي: " + err.message, "error");
  }
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[s]));
}
