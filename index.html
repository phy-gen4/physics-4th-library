function getYoutubeEmbed(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}

function getViewUrl(url) {
  if (!url) return "#";
  const yt = getYoutubeEmbed(url);
  if (yt) return yt;
  const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
  return url;
}

function getDownloadUrl(url) {
  if (!url) return "#";
  const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) return `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
  return url;
}

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));

  return `

// الراسم البياني للمختبر وحساب الميل
function drawLabGraph() {
  const canvas = document.getElementById("labGraphCanvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const xStr = (document.getElementById("grDataX").value || "").split(",").map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
  const yStr = (document.getElementById("grDataY").value || "").split(",").map(v => parseFloat(v.trim())).filter(v => !isNaN(v));
  const labelX = document.getElementById("grLabelX").value || "X";
  const labelY = document.getElementById("grLabelY").value || "Y";
  const n = Math.min(xStr.length, yStr.length);

  ctx.fillStyle = "#060d18";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (n < 2) {
    document.getElementById("graphResultBox").innerHTML = `<span style="color:var(--danger)">يرجى إدخال نقطتين على الأقل في كل من محور X ومحور Y.</span>`;
    return;
  }

  const xs = xStr.slice(0, n), ys = yStr.slice(0, n);
  let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
  for (let i = 0; i < n; i++) {
    sumX += xs[i]; sumY += ys[i];
    sumXY += xs[i] * ys[i]; sumX2 += xs[i] * xs[i];
  }
  const denom = (n * sumX2 - sumX * sumX);
  const slope = denom !== 0 ? (n * sumXY - sumX * sumY) / denom : 0;
  const intercept = (sumY - slope * sumX) / n;

  const padL = 55, padR = 25, padT = 30, padB = 45;
  const w = canvas.width - padL - padR;
  const h = canvas.height - padT - padB;
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys, slope * minX + intercept), maxY = Math.max(...ys, slope * maxX + intercept);
  const spanX = (maxX - minX) || 1, spanY = (maxY - minY) || 1;

  // رسم الشبكة البيانية
  ctx.strokeStyle = "#162840";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 5; i++) {
    const gy = padT + (h * i / 5);
    ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(padL + w, gy); ctx.stroke();
    const gx = padL + (w * i / 5);
    ctx.beginPath(); ctx.moveTo(gx, padT); ctx.lineTo(gx, padT + h); ctx.stroke();
  }

  // المحاور
  ctx.strokeStyle = "#5c7696";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + h); ctx.lineTo(padL + w, padT + h);
  ctx.stroke();

  const toPxX = val => padL + ((val - minX) / spanX) * w;
  const toPxY = val => padT + h - ((val - minY) / spanY) * h;

  // خط أفضل مطابقة (Best-fit Line)
  ctx.strokeStyle = "#35c8ff";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(toPxX(minX), toPxY(slope * minX + intercept));
  ctx.lineTo(toPxX(maxX), toPxY(slope * maxX + intercept));
  ctx.stroke();

  // النقاط العملية
  for (let i = 0; i < n; i++) {
    const px = toPxX(xs[i]), py = toPxY(ys[i]);
    ctx.fillStyle = "#ff5470";
    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
  }

  // كتابة المعادلة والمحاور على الرسم
  ctx.fillStyle = "#eef7ff";
  ctx.font = "bold 13px Tahoma";
  ctx.fillText(`${labelX}`, padL + w / 2 - 25, canvas.height - 12);
  ctx.fillText(`${labelY}`, 12, padT - 10);
  ctx.fillStyle = "#35d39a";
  ctx.fillText(`Slope (m) = ${slope.toFixed(4)}  |  Y = ${slope.toFixed(3)}X + (${intercept.toFixed(3)})`, padL + 10, padT + 18);

  document.getElementById("graphResultBox").innerHTML = `
    <div>📐 الميل <b>Slope (m)</b>: <b dir="ltr" style="color:var(--a)">${slope.toFixed(4)}</b></div>
    <div>📍 التقاطع <b>Intercept (b)</b>: <b dir="ltr" style="color:var(--ok)">${intercept.toFixed(4)}</b></div>
    <div>📈 معادلة المستقيم: <b dir="ltr" style="color:var(--warn)">Y = ${slope.toFixed(3)} X + ${intercept.toFixed(3)}</b></div>
  `;
}

function calcNuclearDecay() {
  const n0 = parseFloat(document.getElementById("ndN0").value) || 0;
  const half = parseFloat(document.getElementById("ndHalf").value) || 1;
  const t = parseFloat(document.getElementById("ndTime").value) || 0;
  const lambda = Math.LN2 / half;
  const rem = n0 * Math.exp(-lambda * t);
  document.getElementById("ndLambda").textContent = lambda.toFixed(5);
  document.getElementById("ndRem").textContent = rem.toFixed(4);
  document.getElementById("ndDecayed").textContent = Math.max(0, n0 - rem).toFixed(4);
}

// صوت مطر هادئ للتركيز (Web Audio API بدون ملفات خارجية)
let audioCtx = null;
let noiseNode = null;
let ambientPlaying = false;

function toggleAmbientSound() {
  if (ambientPlaying) {
    if (noiseNode) { noiseNode.disconnect(); noiseNode = null; }
    ambientPlaying = false;
  } else {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = 2 * audioCtx.sampleRate;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = buffer.getChannelData(0);
    let lastOut = 0.0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      output[i] = (lastOut + (0.02 * white)) / 1.02;
      lastOut = output[i];
      output[i] *= 0.15;
    }
    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = buffer;
    noiseNode.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 600;
    noiseNode.connect(filter);
    filter.connect(audioCtx.destination);
    noiseNode.start(0);
    ambientPlaying = true;
  }
  const btn = document.getElementById("ambientSoundBtn");
  if (btn) btn.textContent = ambientPlaying ? "🔇 إيقاف صوت المطر الهادئ" : "🌧️ تشغيل صوت مطر هادئ للتركيز";
}

let pomoSeconds = 25 * 60;

function formatPomoTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");

}

function togglePomo() {
  if (pomoTimer) {

    pomoTimer = setInterval(() => {
      if (pomoSeconds > 0) {
        pomoSeconds--;

function runUnitConverter() {
  const val = parseFloat(document.getElementById("convInput").value) || 0;
  const type = document.getElementById("convType").value;
  let out = "";
  if (type === "ev_to_j") out = (val * 1.602176634e-19).toExponential(5) + " J";
  else if (type === "j_to_ev") out = (val / 1.602176634e-19).toExponential(5) + " eV";
  else if (type === "mev_to_j") out = (val * 1.602176634e-13).toExponential(5) + " J";
  else if (type === "ang_to_nm") out = (val * 0.1).toFixed(4) + " nm";
  else if (type === "ang_to_m") out = (val * 1e-10).toExponential(4) + " m";
  else if (type === "c_to_k") out = (val + 273.15).toFixed(2) + " K";
  else if (type === "nm_to_ev") out = val > 0 ? (1239.84193 / val).toFixed(4) + " eV" : "0 eV";
  document.getElementById("convOutput").textContent = out;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadFileToGitHubRepo(file, ghCfg) {
  const dataUrl = await fileToBase64(file);
  const base64Content = dataUrl.split(",")[1];
  const safeName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = `uploads/${safeName}`;
  const apiUrl = `https://api.github.com/repos/${ghCfg.owner}/${ghCfg.repo}/contents/${path}`;
  const res = await fetch(apiUrl, {
    method: "PUT",
    headers: { "Authorization": `Bearer ${ghCfg.token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ message: `Upload ${file.name}`, content: base64Content })
  });
  if (!res.ok) throw new Error("فشل رفع الملف إلى GitHub");
  return path;
}

async function handleUpload(e) {
  e.preventDefault();
  const subject = document.getElementById("upSubject").value;
  const category = document.getElementById("upCategory").value;
  const titleInput = document.getElementById("upTitle").value.trim();
  const teacher = document.getElementById("upTeacher").value.trim();
  const directUrl = document.getElementById("upUrl").value.trim();
  const fileList = document.getElementById("upFiles").files;
  const ghCfg = JSON.parse(localStorage.getItem("phys_gh_cfg") || "{}");

  const btn = document.getElementById("uploadBtn");
  btn.disabled = true;
  btn.textContent = "جاري الرفع والحفظ...";

  try {
    if (directUrl) {
      store.files.unshift({
        id: Date.now(), created_at: Date.now(), subject, category,
        title: titleInput || "محاضرة دراسية",
        original_name: (titleInput || "file") + ".pdf",
        teacher, url: directUrl, downloads: 0
      });
    } else if (fileList && fileList.length > 0) {
      for (const file of Array.from(fileList)) {
        const finalTitle = titleInput || file.name.replace(/\.pdf$/i, "");
        let fileUrl = (ghCfg.owner && ghCfg.repo && ghCfg.token)
          ? await uploadFileToGitHubRepo(file, ghCfg)
          : await fileToBase64(file);

        store.files.unshift({
          id: Date.now() + Math.floor(Math.random() * 1000),
          created_at: Date.now(), subject, category,
          title: finalTitle, original_name: file.name,
          teacher, url: fileUrl, downloads: 0
        });
      }
    } else {
      showFlash("يرجى وضع رابط أو اختيار ملف PDF", "error");
      btn.disabled = false; btn.textContent = "إضافة ونشر للطلاب";
      return;
    }

    saveLocalStore();
    await syncToGitHub(true);
    showFlash("✅ تمت الإضافة والنشر للطلاب بنجاح!");
    render();
  } catch (err) {
    showFlash("حدث خطأ: " + err.message, "error");
  } finally {
    if (document.getElementById("uploadBtn")) {
      document.getElementById("uploadBtn").disabled = false;
      document.getElementById("uploadBtn").textContent = "إضافة ونشر للطلاب";
    }
  }
}

function exportUpdatedHtml() {
  const dataJson = JSON.stringify(store, null, 2);
  let fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  fullHtml = fullHtml.replace(
    /\/\* === START_SHARED_DATA === \*\/[\s\S]*?\/\* === END_SHARED_DATA === \*\//,
    `/* === START_SHARED_DATA === */\nconst SHARED_DATA = ${dataJson};\n/* === END_SHARED_DATA === */`
  );
  const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  showFlash("تم تنزيل index.html المحدث!");
}

async function syncToGitHub(silent = false) {
  const ghCfg = JSON.parse(localStorage.getItem("phys_gh_cfg") || "{}");
  if (!ghCfg.owner || !ghCfg.repo || !ghCfg.token) {
    if (!silent) showFlash("أدخل إعدادات GitHub في أسفل لوحة الإدارة أولاً", "error");
    return;
  }
  try {
    const apiUrl = `https://api.github.com/repos/${ghCfg.owner}/${ghCfg.repo}/contents/data.json`;
    let sha = undefined;
    const getRes = await fetch(apiUrl, { headers: { "Authorization": `Bearer ${ghCfg.token}` } });
    if (getRes.ok) sha = (await getRes.json()).sha;

    const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(store, null, 2))));
    const putRes = await fetch(apiUrl, {
      method: "PUT",
      headers: { "Authorization": `Bearer ${ghCfg.token}`, "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Update physics library data", content: contentBase64, sha })
    });
    if (!putRes.ok) throw new Error("تأكد من صلاحية Token واسم المستودع");
    if (!silent) showFlash("✅ تم نشر جميع التحديثات تلقائياً على GitHub وأصبحت ظاهرة لكل الطلاب الآن!");
  } catch (err) {
    if (!silent) showFlash("خطأ في النشر التلقائي: " + err.message, "error");
  }
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[s]));
}
