<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية | مكتبة الفيزياء</title>
<style>
:root{--bg:#07101d;--panel:#0e1a2a;--panel2:#122237;--text:#eef7ff;--muted:#9eb0c4;--line:#1e334c;--a:#35c8ff;--b:#6675ff;--danger:#ff5470;--ok:#35d39a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#153052 0,transparent 35%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}a{text-decoration:none;color:inherit}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#07101de8;backdrop-filter:blur(16px);z-index:5}.brand{display:flex;align-items:center;gap:10px;cursor:pointer}.brand>span{font-size:30px}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}nav{display:flex;gap:18px;color:var(--muted);align-items:center}nav a{cursor:pointer}nav a:hover{color:var(--a)}.theme{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;color:var(--text)}.hero{max-width:1180px;margin:55px auto 30px;padding:50px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(135deg,#10243a,#0b1525);display:flex;justify-content:space-between;align-items:center;overflow:hidden}.hero h1{font-size:50px;margin:18px 0}.hero em{font-style:normal;background:linear-gradient(90deg,var(--a),#8791ff);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);max-width:650px;line-height:1.9}.orb{font-size:130px;filter:drop-shadow(0 0 35px #35c8ff66)}.pill{display:inline-block;padding:7px 12px;border-radius:999px;background:#35c8ff15;border:1px solid #35c8ff40;color:var(--a);font-size:13px}.search{display:flex;gap:10px;margin-top:25px;max-width:650px}.search input,input,select,textarea{width:100%;background:#081322;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px;outline:none}.search button,.primary{border:0;border-radius:12px;background:linear-gradient(90deg,var(--a),var(--b));color:white;padding:12px 22px;font-weight:bold;cursor:pointer}.stats{max-width:1180px;margin:20px auto 50px;display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stats div,.panel,.announcement{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.stats b{font-size:28px;display:block}.stats span{color:var(--muted)}.section,.page-head,.admin-grid,.files,.schedule{max-width:1180px;margin:35px auto}.section-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.section-head span{color:var(--muted)}h2{margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{display:flex;align-items:center;gap:15px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:18px;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-3px);border-color:#35c8ff66}.icon{font-size:30px}.card h3{margin:0 0 7px}.card small{color:var(--muted)}.card strong{margin-right:auto;color:var(--a)}.ann-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.announcement p{color:var(--muted);line-height:1.8}.page-head{padding:30px 0}.page-head h1{font-size:38px;margin:12px 0}.page-head p{color:var(--muted)}.filters{max-width:1180px;margin:0 auto 20px;display:flex;gap:8px;flex-wrap:wrap}.filters a{padding:9px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--muted);cursor:pointer}.filters .active{color:var(--a);border-color:var(--a)}.mini{max-width:1180px;margin:20px auto}.file{display:flex;align-items:center;gap:15px;background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:16px;margin:10px 0}.pdf{background:#ff47571a;color:#ff7080;border:1px solid #ff475740;padding:12px;border-radius:10px;font-weight:bold}.fileinfo{flex:1}.fileinfo h3{margin:0 0 8px}.fileinfo span{color:var(--muted);font-size:12px;margin-left:10px}.actions{display:flex;gap:7px;align-items:center}.actions form{margin:0}.btn{border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:bold;display:inline-block}.view{background:#35c8ff18;color:var(--a)}.download{background:#35d39a18;color:var(--ok)}.danger{background:#ff547018;color:#ff7187}.empty{text-align:center;padding:50px;color:var(--muted);background:var(--panel);border-radius:18px}.auth{min-height:70vh;display:grid;place-items:center}.authbox{width:min(430px,90%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:35px;text-align:center}.authbox>*{margin-bottom:15px}.authbox form{display:grid;gap:12px}.authbox .primary{padding:13px}.bigicon{font-size:45px}.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.panel h2{font-size:20px}.panel form{display:grid;gap:10px}.panel label{display:grid;gap:6px;color:var(--muted);font-size:13px}.uploadbox{border:1px dashed #35c8ff66;padding:18px;text-align:center;border-radius:14px;cursor:pointer}.uploadbox input{border:0}.panel hr{border:0;border-top:1px solid var(--line);margin:25px 0}.minirow{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.minirow small{display:block;color:var(--muted);margin-top:5px}.schedule{display:grid;gap:12px}.schedule article{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;grid-template-columns:1fr 1fr 2fr 2fr auto;gap:10px;align-items:center}.schedule strong{color:var(--a)}.schedule small{color:var(--muted)}footer{text-align:center;color:var(--muted);padding:50px 20px}.flash{max-width:1180px;margin:15px auto;padding:12px;border-radius:12px;background:#35d39a18;color:var(--ok)}.flash.error{background:#ff547018;color:#ff7187}.sync-bar{max-width:1180px;margin:0 auto 25px;background:linear-gradient(135deg,#10243a,#0e1a2a);border:1px solid var(--a);border-radius:18px;padding:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}body.light{--bg:#f2f6fb;--panel:#fff;--panel2:#eef4fb;--text:#102035;--muted:#63758b;--line:#d8e1ec}body.light .top{background:#ffffffdd}body.light input,body.light select,body.light textarea{background:#f7faff;color:#102035}@media(max-width:800px){.top{height:auto;padding:15px 4%;flex-wrap:wrap;gap:12px}nav{order:3;width:100%;overflow:auto}.hero{margin:20px 4%;padding:28px;display:block}.hero h1{font-size:36px}.orb{display:none}.section,.page-head,.files,.schedule,.admin-grid,.sync-bar{margin-left:4%;margin-right:4%}.grid,.admin-grid,.ann-grid,.stats{grid-template-columns:1fr}.stats{margin-left:4%;margin-right:4%}.file{align-items:flex-start;flex-wrap:wrap}.actions{width:100%}.actions .btn{flex:1;text-align:center}.schedule article{grid-template-columns:1fr 1fr}.schedule article span,.schedule article small{grid-column:1/-1}}
</style>
</head>
<body>

<header class="top">
  <a class="brand" onclick="navigate('home')">
    <span>⚛️</span>
    <div>
      <b>مكتبة الفيزياء</b>
      <small>المرحلة الرابعة</small>
    </div>
  </a>
  <nav id="mainNav">
    <a onclick="navigate('home')">الرئيسية</a>
    <a onclick="navigate('schedule')">الجدول الدراسي</a>
    <a id="adminNavLink" onclick="navigate(isAdmin() ? 'admin' : 'login')">لوحة الإدارة</a>
    <a id="logoutNavLink" style="display:none;color:var(--danger)" onclick="logoutAdmin()">خروج</a>
  </nav>
  <button class="theme" onclick="toggleTheme()" title="تغيير المظهر">🌓</button>
</header>

<div id="flashContainer"></div>
<main id="appContent"></main>

<footer>
  مكتبة فيزياء المرحلة الرابعة - النسخة الاحترافية © 2026
</footer>

<script>
/* === START_SHARED_DATA === */
const SHARED_DATA = {
  files: [],
  announcements: [],
  schedule: []
};
/* === END_SHARED_DATA === */

const SUBJECTS = [
  ["quantum", "ميكانيك الكم", "⚛️"],
  ["measurement", "القياس والتقويم", "📏"],
  ["educational_lab", "المختبر التعليمي", "🔬"],
  ["nuclear", "الفيزياء النووية", "☢️"],
  ["solid_state", "فيزياء الحالة الصلبة", "🧊"],
  ["nuclear_lab", "مختبر النووية", "🧪"],
  ["laser", "الليزر", "🔦"],
  ["electromagnetic", "النظرية الكهرومغناطيسية", "⚡"],
  ["teaching", "التربية التعليمية", "👨‍🏫"]
];

const CATEGORIES = ["ملازم", "محاضرات", "ملخصات", "أسئلة وامتحانات", "مصادر", "أخرى"];
const SUBJECT_MAP = {};
SUBJECTS.forEach(s => SUBJECT_MAP[s[0]] = s[1]);

let store = {
  files: JSON.parse(localStorage.getItem("phys_files") || "null") || SHARED_DATA.files,
  announcements: JSON.parse(localStorage.getItem("phys_announcements") || "null") || SHARED_DATA.announcements,
  schedule: JSON.parse(localStorage.getItem("phys_schedule") || "null") || SHARED_DATA.schedule
};

// إذا كانت البيانات المدمجة في الكود أحدث، ندمجها للطلاب تلقائياً
function mergeSharedData(remote) {
  if (!remote) return;
  if (Array.isArray(remote.files) && remote.files.length > 0 && !isAdmin()) {
    store.files = remote.files;
  }
  if (Array.isArray(remote.announcements) && remote.announcements.length > 0 && !isAdmin()) {
    store.announcements = remote.announcements;
  }
  if (Array.isArray(remote.schedule) && remote.schedule.length > 0 && !isAdmin()) {
    store.schedule = remote.schedule;
  }
}
mergeSharedData(SHARED_DATA);

// جلب التحديثات المباشرة من ملف data.json على GitHub إن وجد
fetch("data.json?t=" + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (data) {
      store.files = data.files || store.files;
      store.announcements = data.announcements || store.announcements;
      store.schedule = data.schedule || store.schedule;
      saveLocalStore();
      render();
    }
  })
  .catch(() => {});

function saveLocalStore() {
  localStorage.setItem("phys_files", JSON.stringify(store.files));
  localStorage.setItem("phys_announcements", JSON.stringify(store.announcements));
  localStorage.setItem("phys_schedule", JSON.stringify(store.schedule));
}

function isAdmin() {
  return sessionStorage.getItem("phys_admin") === "1";
}

function showFlash(msg, type = "success") {
  const c = document.getElementById("flashContainer");
  c.innerHTML = `<div class="flash ${type === 'error' ? 'error' : ''}">${msg}</div>`;
  setTimeout(() => { c.innerHTML = ""; }, 5000);
}

function toggleTheme() {
  document.body.classList.toggle("light");
  localStorage.setItem("phys_theme", document.body.classList.contains("light") ? "light" : "dark");
}
if (localStorage.getItem("phys_theme") === "light") {
  document.body.classList.add("light");
}

function updateNav() {
  document.getElementById("logoutNavLink").style.display = isAdmin() ? "inline" : "none";
}

// تحويل روابط Google Drive إلى روابط عرض وتحميل مباشر
function getViewUrl(url) {
  if (!url) return "#";
  const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
  return url;
}

function getDownloadUrl(url) {
  if (!url) return "#";
  const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (driveMatch) return `https://drive.google.com/uc?export=download&id=${driveMatch[1]}`;
  return url;
}

let currentState = { page: "home", slug: "", category: "", q: "" };

function navigate(page, params = {}) {
  currentState = { page, slug: params.slug || "", category: params.category || "", q: params.q || "" };
  updateNav();
  render();
  window.scrollTo(0, 0);
}

function render() {
  const app = document.getElementById("appContent");
  const files = store.files;
  const announcements = store.announcements;
  const schedule = store.schedule;
  const total = files.length;
  const downloads = files.reduce((sum, f) => sum + (f.downloads || 0), 0);

  if (currentState.page === "home") {
    document.title = "الرئيسية | مكتبة الفيزياء";
    const counts = {};
    files.forEach(f => { counts[f.subject] = (counts[f.subject] || 0) + 1; });

    let annHtml = "";
    if (announcements.length > 0) {
      annHtml = `<section class="section"><div class="section-head"><h2>📢 آخر الإعلانات</h2></div><div class="ann-grid">` +
        announcements.slice(0, 5).map(a => `<article class="announcement"><b>${escapeHtml(a.title)}</b><p>${escapeHtml(a.body)}</p></article>`).join("") +
        `</div></section>`;
    }

    const cardsHtml = SUBJECTS.map(([slug, name, icon]) => `
      <a class="card" onclick="navigate('subject', {slug: '${slug}'})">
        <span class="icon">${icon}</span>
        <div><h3>${name}</h3><small>${counts[slug] || 0} ملف</small></div>
        <strong>←</strong>
      </a>
    `).join("");

    app.innerHTML = `
      <section class="hero">
        <div>
          <span class="pill">السنة الدراسية • المرحلة الرابعة</span>
          <h1>كل ملفات الفيزياء<br><em>بمكان واحد</em></h1>
          <p>ملازم، محاضرات، ملخصات، أسئلة وامتحانات ومصادر — مرتبة حسب المادة وسهلة الوصول.</p>
          <form class="search" onsubmit="handleGlobalSearch(event)">
            <input id="homeSearchInput" name="q" placeholder="ابحث عن ملزمة أو محاضرة أو اسم مدرس...">
            <button type="submit">🔎 بحث</button>
          </form>
        </div>
        <div class="orb">⚛</div>
      </section>
      <div class="stats">
        <div><b>${total}</b><span>ملف</span></div>
        <div><b>${downloads}</b><span>تحميل</span></div>
        <div><b>9</b><span>مواد</span></div>
      </div>
      ${annHtml}
      <section class="section">
        <div class="section-head"><h2>📚 المواد الدراسية</h2><span>اختر المادة</span></div>
        <div class="grid">${cardsHtml}</div>
      </section>
    `;
  }

  else if (currentState.page === "subject") {
    const slug = currentState.slug;
    const subjectName = SUBJECT_MAP[slug] || slug;
    document.title = `${subjectName} | المكتبة`;
    const activeCat = currentState.category;
    const q = currentState.q;

    let filtered = files.filter(f => f.subject === slug);
    if (activeCat) filtered = filtered.filter(f => f.category === activeCat);
    if (q) {
      const ql = q.toLowerCase();
      filtered = filtered.filter(f =>
        (f.title && f.title.toLowerCase().includes(ql)) ||
        (f.teacher && f.teacher.toLowerCase().includes(ql)) ||
        (f.original_name && f.original_name.toLowerCase().includes(ql))
      );
    }

    const filtersHtml = `<a class="${!activeCat ? 'active' : ''}" onclick="navigate('subject', {slug: '${slug}', category: '', q: '${escapeHtml(q)}'})">الكل</a>` +
      CATEGORIES.map(c => `<a class="${activeCat === c ? 'active' : ''}" onclick="navigate('subject', {slug: '${slug}', category: '${c}', q: '${escapeHtml(q)}'})">${c}</a>`).join("");

    const filesHtml = filtered.length > 0 ? filtered.map(f => `
      <article class="file">
        <div class="pdf">PDF</div>
        <div class="fileinfo">
          <h3>${escapeHtml(f.title)}</h3>
          <div>
            <span>${escapeHtml(f.category)}</span>
            ${f.teacher ? `<span>👨‍🏫 ${escapeHtml(f.teacher)}</span>` : ""}
            <span>⬇ ${f.downloads || 0}</span>
          </div>
        </div>
        <div class="actions">
          <a class="btn view" target="_blank" href="${getViewUrl(f.url)}" onclick="countDownload(${f.id}, false)">👁 عرض</a>
          <a class="btn download" target="_blank" href="${getDownloadUrl(f.url)}" download="${escapeHtml(f.original_name || f.title + '.pdf')}" onclick="countDownload(${f.id}, true)">⬇ تحميل</a>
          ${isAdmin() ? `<button class="btn danger" onclick="deleteFile(${f.id})">🗑 حذف</button>` : ""}
        </div>
      </article>
    `).join("") : `<div class="empty">لا توجد ملفات هنا حالياً.</div>`;

    app.innerHTML = `
      <section class="page-head">
        <div>
          <span class="pill">مادة دراسية</span>
          <h1>${subjectName}</h1>
          <p>تصفح ملفات المادة أو ابحث داخلها.</p>
        </div>
      </section>
      <div class="filters">${filtersHtml}</div>
      <form class="search mini" onsubmit="handleSubjectSearch(event, '${slug}', '${activeCat}')">
        <input id="subjSearchInput" name="q" value="${escapeHtml(q)}" placeholder="بحث داخل المادة...">
        <button type="submit">بحث</button>
      </form>
      <div class="files">${filesHtml}</div>
    `;
  }

  else if (currentState.page === "search") {
    const q = currentState.q;
    document.title = "البحث";
    const ql = q.toLowerCase();
    const results = q ? files.filter(f =>
      (f.title && f.title.toLowerCase().includes(ql)) ||
      (f.teacher && f.teacher.toLowerCase().includes(ql)) ||
      (f.original_name && f.original_name.toLowerCase().includes(ql))
    ) : [];

    const filesHtml = results.length > 0 ? results.map(f => `
      <article class="file">
        <div class="pdf">PDF</div>
        <div class="fileinfo">
          <h3>${escapeHtml(f.title)}</h3>
          <div>
            <span>${SUBJECT_MAP[f.subject] || f.subject}</span>
            <span>${escapeHtml(f.category)}</span>
          </div>
        </div>
        <div class="actions">
          <a class="btn view" target="_blank" href="${getViewUrl(f.url)}">👁 عرض</a>
          <a class="btn download" target="_blank" href="${getDownloadUrl(f.url)}" download="${escapeHtml(f.original_name || f.title + '.pdf')}" onclick="countDownload(${f.id}, true)">⬇ تحميل</a>
        </div>
      </article>
    `).join("") : `<div class="empty">لم نجد ملفات مطابقة.</div>`;

    app.innerHTML = `
      <section class="page-head">
        <h1>🔎 نتائج البحث</h1>
        <p>نتائج البحث عن: <b>${escapeHtml(q)}</b></p>
      </section>
      <div class="files">${filesHtml}</div>
    `;
  }

  else if (currentState.page === "schedule") {
    document.title = "الجدول الدراسي";
    const rowsHtml = schedule.length > 0 ? schedule.map(r => `
      <article>
        <b>${escapeHtml(r.day)}</b>
        <strong>${escapeHtml(r.time)}</strong>
        <span>${escapeHtml(r.subject)}</span>
        ${r.room ? `<small>📍 ${escapeHtml(r.room)}</small>` : `<small></small>`}
        ${isAdmin() ? `<button class="btn danger" onclick="deleteSchedule(${r.id})">حذف</button>` : ""}
      </article>
    `).join("") : `<div class="empty">لم تتم إضافة مواعيد بعد.</div>`;

    app.innerHTML = `
      <section class="page-head">
        <span class="pill">المواعيد</span>
        <h1>📅 الجدول الدراسي</h1>
      </section>
      <div class="schedule">${rowsHtml}</div>
    `;
  }

  else if (currentState.page === "login") {
    document.title = "دخول الإدارة";
    app.innerHTML = `
      <div class="auth">
        <div class="authbox">
          <div class="bigicon">🔐</div>
          <h1>لوحة الإدارة</h1>
          <p>الدخول مخصص لمسؤول المكتبة فقط.</p>
          <form onsubmit="handleLogin(event)">
            <input id="loginUser" name="username" placeholder="اسم المستخدم" required>
            <input id="loginPass" type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit" class="primary">دخول</button>
          </form>
        </div>
      </div>
    `;
  }

  else if (currentState.page === "admin") {
    if (!isAdmin()) { navigate("login"); return; }
    document.title = "لوحة الإدارة";
    const subjOptions = SUBJECTS.map(([s, n]) => `<option value="${s}">${n}</option>`).join("");
    const catOptions = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join("");
    const ghCfg = JSON.parse(localStorage.getItem("phys_gh_cfg") || "{}");

    const annList = announcements.map(a => `
      <div class="minirow">
        <span><b>${escapeHtml(a.title)}</b><br>${escapeHtml(a.body)}</span>
        <button class="btn danger" onclick="deleteAnnouncement(${a.id})">حذف</button>
      </div>
    `).join("");

    const filesList = files.map(f => `
      <div class="minirow">
        <span>
          <b>${escapeHtml(f.title)}</b>
          <small>${SUBJECT_MAP[f.subject] || f.subject} • ${escapeHtml(f.category)} • ${escapeHtml(f.original_name || "رابط مباشر")}</small>
        </span>
        <span class="actions">
          <a class="btn view" target="_blank" href="${getViewUrl(f.url)}">عرض</a>
          <button class="btn danger" onclick="deleteFile(${f.id})">حذف</button>
        </span>
      </div>
    `).join("");

    app.innerHTML = `
      <section class="page-head">
        <div>
          <span class="pill">ADMIN</span>
          <h1>لوحة إدارة المكتبة</h1>
          <p>أضف الملفات، الإعلانات، وجدول المحاضرات، وانشرها لكل الطلاب على GitHub.</p>
        </div>
      </section>

      <div class="sync-bar">
        <div>
          <h3 style="margin:0 0 6px;color:var(--a)">🌐 نشر التحديثات لكل الطلاب (على جميع الأجهزة)</h3>
          <small style="color:var(--muted)">بعد إضافة الملازم أو الإعلانات أو الجدول، اضغط على زر التنزيل ليرتفع ملف index.html المحدث لكل الطلاب، أو فعّل الربط التلقائي مع GitHub بالأسفل.</small>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="primary" onclick="exportUpdatedHtml()">💾 تنزيل index.html المحدث لكل الطلاب</button>
          <button class="btn view" onclick="syncToGitHub()">☁️ نشر تلقائي مباشر إلى GitHub</button>
        </div>
      </div>

      <div class="admin-grid">
        <section class="panel">
          <h2>➕ إضافة ملفات PDF</h2>
          <form onsubmit="handleUpload(event)">
            <label>المادة<select id="upSubject" name="subject">${subjOptions}</select></label>
            <label>التصنيف<select id="upCategory" name="category">${catOptions}</select></label>
            <label>عنوان الملف<input id="upTitle" name="title" placeholder="مثال: المحاضرة الأولى - ميكانيك الكم"></label>
            <label>اسم المدرس (اختياري)<input id="upTeacher" name="teacher"></label>
            <label>رابط الملف (Google Drive / Telegram أو اتركه فارغاً إذا اخترت ملفاً بالأسفل)
              <input id="upUrl" name="url" placeholder="https://drive.google.com/...">
            </label>
            <label class="uploadbox">📄 أو اختر ملف PDF من جهازك
              <input id="upFiles" type="file" name="files" accept=".pdf,application/pdf" multiple>
            </label>
            <button type="submit" id="uploadBtn" class="primary">إضافة وحفظ الملف</button>
          </form>
        </section>

        <section class="panel">
          <h2>📢 إضافة إعلان</h2>
          <form onsubmit="handleAddAnnouncement(event)">
            <input id="annTitle" name="title" placeholder="عنوان الإعلان" required>
            <textarea id="annBody" name="body" placeholder="نص الإعلان" required></textarea>
            <button type="submit" class="primary">نشر الإعلان</button>
          </form>
          <hr>
          <h3>الإعلانات الحالية</h3>
          ${annList}
        </section>

        <section class="panel">
          <h2>📅 إضافة موعد للجدول</h2>
          <form onsubmit="handleAddSchedule(event)">
            <input id="schDay" name="day" placeholder="اليوم" required>
            <input id="schTime" name="time" placeholder="الوقت" required>
            <input id="schSubject" name="subject" placeholder="المادة" required>
            <input id="schRoom" name="room" placeholder="القاعة / المختبر">
            <button type="submit" class="primary">إضافة للجدول</button>
          </form>
          <hr>
          <h2>⚡ إعداد النشر التلقائي (اختياري)</h2>
          <form onsubmit="saveGhConfig(event)">
            <input id="ghOwner" placeholder="اسم حسابك في GitHub (مثال: ahmed)" value="${escapeHtml(ghCfg.owner || '')}">
            <input id="ghRepo" placeholder="اسم المستودع (مثال: physics-site)" value="${escapeHtml(ghCfg.repo || '')}">
            <input id="ghToken" type="password" placeholder="مفتاح GitHub Token (اختياري للنشر التلقائي)" value="${escapeHtml(ghCfg.token || '')}">
            <button type="submit" class="btn view">حفظ إعدادات GitHub</button>
          </form>
        </section>
      </div>

      <section class="panel">
        <div class="section-head">
          <h2>📚 الملفات (${total})</h2>
          <span>إجمالي التحميلات: ${downloads}</span>
        </div>
        <div class="adminlist">${filesList}</div>
      </section>
    `;
  }
}

function handleGlobalSearch(e) {
  e.preventDefault();
  const q = document.getElementById("homeSearchInput").value.trim();
  navigate("search", { q });
}

function handleSubjectSearch(e, slug, category) {
  e.preventDefault();
  const q = document.getElementById("subjSearchInput").value.trim();
  navigate("subject", { slug, category, q });
}

function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  if (u === "admin" && p === "physics2026") {
    sessionStorage.setItem("phys_admin", "1");
    showFlash("تم تسجيل الدخول بنجاح");
    navigate("admin");
  } else {
    showFlash("اسم المستخدم أو كلمة المرور غير صحيحة", "error");
  }
}

function logoutAdmin() {
  sessionStorage.removeItem("phys_admin");
  navigate("home");
}

function saveGhConfig(e) {
  e.preventDefault();
  const owner = document.getElementById("ghOwner").value.trim();
  const repo = document.getElementById("ghRepo").value.trim();
  const token = document.getElementById("ghToken").value.trim();
  localStorage.setItem("phys_gh_cfg", JSON.stringify({ owner, repo, token }));
  showFlash("تم حفظ إعدادات GitHub بنجاح");
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadFileToGitHubRepo(file, ghCfg) {
  const dataUrl = await fileToBase64(file);
  const base64Content = dataUrl.split(",")[1];
  const safeName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = `uploads/${safeName}`;
  const apiUrl = `https://api.github.com/repos/${ghCfg.owner}/${ghCfg.repo}/contents/${path}`;

  const res = await fetch(apiUrl, {
    method: "PUT",
    headers: {
      "Authorization": `Bearer ${ghCfg.token}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: `Upload ${file.name}`,
      content: base64Content
    })
  });
  if (!res.ok) throw new Error("فشل رفع الملف إلى GitHub");
  return path;
}

async function handleUpload(e) {
  e.preventDefault();
  const subject = document.getElementById("upSubject").value;
  const category = document.getElementById("upCategory").value;
  const titleInput = document.getElementById("upTitle").value.trim();
  const teacher = document.getElementById("upTeacher").value.trim();
  const directUrl = document.getElementById("upUrl").value.trim();
  const fileList = document.getElementById("upFiles").files;
  const ghCfg = JSON.parse(localStorage.getItem("phys_gh_cfg") || "{}");

  const btn = document.getElementById("uploadBtn");
  btn.disabled = true;
  btn.textContent = "جاري الحفظ...";

  try {
    if (directUrl) {
      store.files.unshift({
        id: Date.now(),
        subject,
        category,
        title: titleInput || "ملف دراسي",
        original_name: (titleInput || "file") + ".pdf",
        teacher,
        url: directUrl,
        downloads: 0
      });
    } else if (fileList && fileList.length > 0) {
      for (const file of Array.from(fileList)) {
        const finalTitle = titleInput || file.name.replace(/\.pdf$/i, "");
        let fileUrl = "";

        if (ghCfg.owner && ghCfg.repo && ghCfg.token) {
          fileUrl = await uploadFileToGitHubRepo(file, ghCfg);
        } else {
          fileUrl = await fileToBase64(file);
        }

        store.files.unshift({
          id: Date.now() + Math.floor(Math.random() * 10000),
          subject,
          category,
          title: finalTitle,
          original_name: file.name,
          teacher,
          url: fileUrl,
          downloads: 0
        });
      }
    } else {
      showFlash("يرجى وضع رابط الملف أو اختيار ملف PDF من جهازك", "error");
      btn.disabled = false;
      btn.textContent = "إضافة وحفظ الملف";
      return;
    }

    saveLocalStore();
    if (ghCfg.owner && ghCfg.repo && ghCfg.token) {
      await syncToGitHub(true);
    } else {
      showFlash("تمت الإضافة! اضغط على (تنزيل index.html المحدث) لرفعها لكل الطلاب على GitHub");
    }
    render();
  } catch (err) {
    showFlash("حدث خطأ أثناء رفع الملف: " + err.message, "error");
  } finally {
    if (document.getElementById("uploadBtn")) {
      document.getElementById("uploadBtn").disabled = false;
      document.getElementById("uploadBtn").textContent = "إضافة وحفظ الملف";
    }
  }
}

function countDownload(id, rerender) {
  const f = store.files.find(x => x.id === id);
  if (f) {
    f.downloads = (f.downloads || 0) + 1;
    saveLocalStore();
    if (rerender) render();
  }
}

function deleteFile(id) {
  if (!confirm("تأكيد حذف الملف؟")) return;
  store.files = store.files.filter(f => f.id !== id);
  saveLocalStore();
  showFlash("تم حذف الملف");
  render();
}

function handleAddAnnouncement(e) {
  e.preventDefault();
  const title = document.getElementById("annTitle").value.trim();
  const body = document.getElementById("annBody").value.trim();
  if (!title || !body) return;
  store.announcements.unshift({ id: Date.now(), title, body });
  saveLocalStore();
  showFlash("تمت إضافة الإعلان! لا تنسَ نشر التحديث ليظهر عند الطلاب.");
  render();
}

function deleteAnnouncement(id) {
  store.announcements = store.announcements.filter(a => a.id !== id);
  saveLocalStore();
  render();
}

function handleAddSchedule(e) {
  e.preventDefault();
  const day = document.getElementById("schDay").value.trim();
  const time = document.getElementById("schTime").value.trim();
  const subject = document.getElementById("schSubject").value.trim();
  const room = document.getElementById("schRoom").value.trim();
  if (!day || !time || !subject) return;
  store.schedule.unshift({ id: Date.now(), day, time, subject, room });
  saveLocalStore();
  showFlash("تمت إضافة الموعد للجدول!");
  render();
}

function deleteSchedule(id) {
  store.schedule = store.schedule.filter(r => r.id !== id);
  saveLocalStore();
  render();
}

// تصدير ملف index.html محدث وبداخله كل الملازم والإعلانات والجدول ليظهر لكل الطلاب
function exportUpdatedHtml() {
  const dataJson = JSON.stringify(store, null, 2);
  let fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  fullHtml = fullHtml.replace(
    /\/\* === START_SHARED_DATA === \*\/[\s\S]*?\/\* === END_SHARED_DATA === \*\//,
    `/* === START_SHARED_DATA === */\nconst SHARED_DATA = ${dataJson};\n/* === END_SHARED_DATA === */`
  );
  const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  a.remove();
  showFlash("تم تنزيل ملف index.html المحدث! ارفعه إلى GitHub ليظهر لكل الطلاب فوراً.");
}

// مزامنة تلقائية مع GitHub عبر API
async function syncToGitHub(silent = false) {
  const ghCfg = JSON.parse(localStorage.getItem("phys_gh_cfg") || "{}");
  if (!ghCfg.owner || !ghCfg.repo || !ghCfg.token) {
    if (!silent) showFlash("لاستخدام النشر التلقائي، أدخل اسم حسابك والمستودع و Token في أسفل لوحة الإدارة، أو استخدم زر (تنزيل index.html المحدث)", "error");
    return;
  }
  try {
    const apiUrl = `https://api.github.com/repos/${ghCfg.owner}/${ghCfg.repo}/contents/data.json`;
    let sha = undefined;
    const getRes = await fetch(apiUrl, {
      headers: { "Authorization": `Bearer ${ghCfg.token}` }
    });
    if (getRes.ok) {
      const existing = await getRes.json();
      sha = existing.sha;
    }
    const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(store, null, 2))));
    const putRes = await fetch(apiUrl, {
      method: "PUT",
      headers: {
        "Authorization": `Bearer ${ghCfg.token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "Update library data",
        content: contentBase64,
        sha
      })
    });
    if (!putRes.ok) throw new Error("تأكد من صحة Token واسم المستودع");
    showFlash("✅ تم نشر التحديثات تلقائياً على GitHub وأصبحت ظاهرة لكل الطلاب الآن!");
  } catch (err) {
    showFlash("خطأ في النشر التلقائي: " + err.message, "error");
  }
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[s]));
}

updateNav();
render();
